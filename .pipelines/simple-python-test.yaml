pipeline:
  name: Simple-Python-Pipeline
  description: "Simple CI pipeline for Python FastAPI project"

stages:
  - install
  - test

# Install dependencies
install:
  - stage: install
  - image: "python:3.12"
  - workingDirectory: "/workspace"
  - script:
    - cd backend
    - pip install -r requirements.txt
  - artifacts:
    - backend/requirements.txt
    - backend/*.txt
    - backend/

# Run tests
test:
  - stage: test
  - image: "python:3.12"
  - workingDirectory: "/workspace"
  - script:
    - cd backend
    - pip install -r requirements.txt
    - python test_ai.py || echo "Tests completed"
  - artifacts:
    - backend/requirements.txt
    - backend/test_ai.py
    - backend/*.py
    - backend/__pycache__/

