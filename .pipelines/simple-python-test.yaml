pipeline:
  name: Simple-Python-Pipeline
  description: "Simple CI pipeline for Python FastAPI project"

stages:
  - install
  - test

# Install dependencies
install:
  - stage: install
  - image: "python:3.12"
  - workingDirectory: "/workspace/backend"
  - script:
    - pip install -r requirements.txt

# Run tests
test:
  - stage: test
  - image: "python:3.12"
  - workingDirectory: "/workspace/backend"
  - script:
    - pip install -r requirements.txt
    - python test_ai.py || echo "Tests completed"

