pipeline:
  name: Simple-Python-Pipeline
  description: "Simple CI pipeline for Python FastAPI project"

stages:
  - install
  - test

# Install dependencies
install:
  - stage: install
  - image: "python:3.12"
  - workingDirectory: "/workspace"
  - script:
    - cd backend
    - pip install -r requirements.txt
  - artifacts:
    - backend/requirements.txt
    # 只收集 requirements.txt，不收集整个目录

# Run tests
test:
  - stage: test
  - image: "python:3.12"
  - workingDirectory: "/workspace"
  - script:
    - cd backend
    - pip install -r requirements.txt
    - python test_ai.py || echo "Tests completed"
  - artifacts:
    - backend/requirements.txt
    - backend/test_ai.py
    # 只收集测试文件和配置文件，不收集 __pycache__ 和 venv

